name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          P='<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.VIBRATE"/>'
          sed -i "s#</manifest>#${P}</manifest>#" $M
      - name: Native code
        run: |
          D=android/app/src/main/java/com/myself/waterreminder
          cat > $D/MainActivity.java <<'J1'
          package com.myself.waterreminder;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(HelperPlugin.class);
              super.onCreate(savedInstanceState);
              if (Build.VERSION.SDK_INT >= 26) {
                Uri uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                AudioAttributes aa = new AudioAttributes.Builder()
                  .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIC).build();
                NotificationChannel ch = new NotificationChannel("water_ring", "تذكير الماية", NotificationManager.IMPORTANCE_HIGH);
                ch.setSound(uri, aa);
                ch.enableVibration(true);
                ch.setVibrationPattern(new long[]{0, 800, 400, 800, 400, 800});
                ch.setLockscreenVisibility(1);
                getSystemService(NotificationManager.class).createNotificationChannel(ch);
              }
            }
          }
          J1
          cat > $D/HelperPlugin.java <<'J2'
          package com.myself.waterreminder;

          import android.app.AlarmManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Helper")
          public class HelperPlugin extends Plugin {
            private void go(Intent i) {
              try { i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); getContext().startActivity(i); } catch (Exception e) {}
            }
            private Uri pkg() { return Uri.parse("package:" + getContext().getPackageName()); }

            @PluginMethod
            public void status(PluginCall call) {
              Context c = getContext();
              JSObject r = new JSObject();
              PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
              r.put("battery", pm.isIgnoringBatteryOptimizations(c.getPackageName()));
              boolean ex = true;
              if (Build.VERSION.SDK_INT >= 31) {
                ex = ((AlarmManager) c.getSystemService(Context.ALARM_SERVICE)).canScheduleExactAlarms();
              }
              r.put("exact", ex);
              call.resolve(r);
            }

            @PluginMethod
            public void askBattery(PluginCall call) {
              go(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, pkg()));
              call.resolve();
            }

            @PluginMethod
            public void askExact(PluginCall call) {
              if (Build.VERSION.SDK_INT >= 31) go(new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM, pkg()));
              call.resolve();
            }

            @PluginMethod
            public void appSettings(PluginCall call) {
              go(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, pkg()));
              call.resolve();
            }

            @PluginMethod
            public void channelSettings(PluginCall call) {
              Intent i = new Intent(Settings.ACTION_CHANNEL_NOTIFICATION_SETTINGS);
              i.putExtra(Settings.EXTRA_APP_PACKAGE, getContext().getPackageName());
              i.putExtra(Settings.EXTRA_CHANNEL_ID, "water_ring");
              go(i);
              call.resolve();
            }
          }
          J2
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: water-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
