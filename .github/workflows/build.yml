name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/></manifest>#' $M
      - name: Ringtone channel
        run: |
          cat > android/app/src/main/java/com/myself/waterreminder/MainActivity.java <<'EOF'
          package com.myself.waterreminder;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (Build.VERSION.SDK_INT >= 26) {
                Uri uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                AudioAttributes aa = new AudioAttributes.Builder()
                  .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIC).build();
                NotificationChannel ch = new NotificationChannel("water_ring", "تذكير الماية", NotificationManager.IMPORTANCE_HIGH);
                ch.setSound(uri, aa);
                ch.enableVibration(true);
                ch.setVibrationPattern(new long[]{0, 800, 400, 800, 400, 800});
                ch.setLockscreenVisibility(1);
                getSystemService(NotificationManager.class).createNotificationChannel(ch);
              }
            }
          }
          EOF
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: water-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
