name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED REQUEST_IGNORE_BATTERY_OPTIMIZATIONS WAKE_LOCK VIBRATE; do
            sed -i "s#</manifest>#<uses-permission android:name=\"android.permission.$p\"/></manifest>#" $M
          done
      - name: Copy native code
        run: cp native/*.java android/app/src/main/java/com/myself/waterreminder/
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: water-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
